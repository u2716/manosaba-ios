name: Build Manosaba Android APK (Android 11)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag of the DRAFT release containing the ExeFS zip'
        required: true
        type: string

permissions:
  contents: write

env:
  DM_ROOT: ${{ github.workspace }}/work
  DM_GAME: manosaba
  API: '30'
  NDK_VERSION: '30.0.16248370'
  DM_TARGET: 'android'  # Global target for scripts

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install SDK packages + NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.1" "platforms;android-35" "ndk;${NDK_VERSION}"
          echo "NDK=$ANDROID_HOME/ndk/${NDK_VERSION}"              >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"                    >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create Python virtual environment for build
        run: |
          set -euo pipefail
          VENV_DIR="$DM_ROOT/build/cache/dm/venv"
          mkdir -p "$DM_ROOT/build/cache/dm"
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/pip" install --upgrade pip
          "$VENV_DIR/bin/pip" install capstone lz4 pyelftools keystone-engine unicorn
          if [ -f tools/requirements.txt ]; then 
            "$VENV_DIR/bin/pip" install -r tools/requirements.txt
          fi

      - name: Download ExeFS zip from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" \
            --pattern '*[Ee]xe[Ff][Ss]*.zip' \
            --dir release-assets \
            --clobber
          ls -la release-assets/

      - name: Read workspace paths from game.json
        id: ws
        run: |
          set -euo pipefail
          EXEFS=$(jq -r '.workspace.exefs'               games/manosaba/game.json)
          PRODUCT=$(jq -r '.workspace.product'           games/manosaba/game.json)
          SHADER_CAP=$(jq -r '.workspace.shader_capture' games/manosaba/game.json)
          echo "exefs=$EXEFS"               >> "$GITHUB_OUTPUT"
          echo "product=$PRODUCT"           >> "$GITHUB_OUTPUT"
          echo "shader_capture=$SHADER_CAP" >> "$GITHUB_OUTPUT"

      - name: Extract ExeFS into workspace
        run: |
          set -euo pipefail
          EXEFS_DIR="$DM_ROOT/${{ steps.ws.outputs.exefs }}"
          mkdir -p "$EXEFS_DIR"
          TMP=$(mktemp -d)
          for z in release-assets/*.zip; do
            unzip -o "$z" -d "$TMP"
          done
          SRC=$(find "$TMP" -maxdepth 3 -type f -name main -printf '%h\n' | head -n1)
          if [ -z "$SRC" ]; then
            echo "ERROR: 'main' not found in the ExeFS zip" >&2
            ls -R "$TMP" >&2
            exit 1
          fi
          cp -a "$SRC"/. "$EXEFS_DIR"/

      - name: Build product from ExeFS
        run: ./tools/build_product.sh
        env:
          DM_ROOT: ${{ env.DM_ROOT }}
          DM_GAME: ${{ env.DM_GAME }}
          DM_TARGET: android

      - name: Show rewriter logs on failure
        if: failure()
        run: |
          set +e
          for f in $(find "$DM_ROOT/build/cache/dm/out" -name '*.log' -type f 2>/dev/null); do
            echo "----- $f -----"
            cat "$f"
            echo
          done

      - name: Patch project for Android 11 (API 30) compatibility
        run: |
          # 1. Fix the hardcoded macOS NDK path
          sed -i 's/darwin-x86_64/linux-x86_64/g' android/Makefile
          
          # 2. Remove the macOS-only 'sips' command
          sed -i '/sips -Z 432/d' android/Makefile
          
          # 3. Change native NDK target to API 30
          sed -i 's/aarch64-linux-android35-clang/aarch64-linux-android30-clang/g' android/Makefile
          
          # 4. Change Java D8 target to API 30
          sed -i 's/--min-api 34/--min-api 30/g' android/Makefile
          
          # 5. Lower minSdk in apk.py to 30
          sed -i 's/MIN_SDK = TARGET_SDK = 35/MIN_SDK = 30\nTARGET_SDK = 35/' android/tools/apk.py
          
          # 6. Inject the Vulkan shim into the Makefile's Android sources
          sed -i 's|compat/sha256.c)|compat/sha256.c compat/vk_shim.c)|' android/Makefile
          
          # 7. Provide timezone shims in darwin.h
          cat << 'EOF' >> android/compat/darwin.h
          
          #ifndef __ASSEMBLER__
          #include <time.h>
          #include <stdlib.h>
          #if defined(__ANDROID__) && __ANDROID_API__ < 35
          static inline timezone_t tzalloc(const char *name) { (void)name; return (timezone_t)1; }
          static inline void tzfree(timezone_t tz) { (void)tz; }
          static inline struct tm *localtime_rz(timezone_t tz, const time_t *timep, struct tm *result) { (void)tz; return localtime_r(timep, result); }
          #endif
          #endif
          EOF
          
          # 8. Create the Vulkan Shim to fix linker errors on API 30
          cat << 'EOF' > android/compat/vk_shim.c
          #include <vulkan/vulkan.h>
          #include <dlfcn.h>
          #include <stddef.h>

          void vkCmdPipelineBarrier2(VkCommandBuffer cb, const VkDependencyInfo* pDep) {
              static PFN_vkCmdPipelineBarrier2 real = NULL;
              if (!real) real = (PFN_vkCmdPipelineBarrier2)dlsym(RTLD_DEFAULT, "vkCmdPipelineBarrier2");
              if (real) real(cb, pDep);
          }
          void vkCmdWriteTimestamp2(VkCommandBuffer cb, VkPipelineStageFlags2 stage, VkQueryPool pool, uint32_t query) {
              static PFN_vkCmdWriteTimestamp2 real = NULL;
              if (!real) real = (PFN_vkCmdWriteTimestamp2)dlsym(RTLD_DEFAULT, "vkCmdWriteTimestamp2");
              if (real) real(cb, stage, pool, query);
          }
          VkResult vkQueueSubmit2(VkQueue queue, uint32_t submitCount, const VkSubmitInfo2* pSubmits, VkFence fence) {
              static PFN_vkQueueSubmit2 real = NULL;
              if (!real) real = (PFN_vkQueueSubmit2)dlsym(RTLD_DEFAULT, "vkQueueSubmit2");
              if (real) return real(queue, submitCount, pSubmits, fence);
              return VK_ERROR_INITIALIZATION_FAILED;
          }
          void vkCmdBeginRendering(VkCommandBuffer cb, const VkRenderingInfo* pRenderingInfo) {
              static PFN_vkCmdBeginRendering real = NULL;
              if (!real) real = (PFN_vkCmdBeginRendering)dlsym(RTLD_DEFAULT, "vkCmdBeginRendering");
              if (real) real(cb, pRenderingInfo);
          }
          void vkCmdEndRendering(VkCommandBuffer cb) {
              static PFN_vkCmdEndRendering real = NULL;
              if (!real) real = (PFN_vkCmdEndRendering)dlsym(RTLD_DEFAULT, "vkCmdEndRendering");
              if (real) real(cb);
          }
          VkResult vkWaitSemaphores(VkDevice device, const VkSemaphoreWaitInfo* pWaitInfo, uint64_t timeout) {
              static PFN_vkWaitSemaphores real = NULL;
              if (!real) real = (PFN_vkWaitSemaphores)dlsym(RTLD_DEFAULT, "vkWaitSemaphores");
              if (real) return real(device, pWaitInfo, timeout);
              return VK_TIMEOUT;
          }
          void vkCmdBindVertexBuffers2(VkCommandBuffer cb, uint32_t firstBinding, uint32_t bindingCount, const VkBuffer* pBuffers, const VkDeviceSize* pOffsets, const VkDeviceSize* pSizes, const VkDeviceSize* pStrides) {
              static PFN_vkCmdBindVertexBuffers2 real = NULL;
              if (!real) real = (PFN_vkCmdBindVertexBuffers2)dlsym(RTLD_DEFAULT, "vkCmdBindVertexBuffers2");
              if (real) real(cb, firstBinding, bindingCount, pBuffers, pOffsets, pSizes, pStrides);
              else vkCmdBindVertexBuffers(cb, firstBinding, bindingCount, pBuffers, pOffsets);
          }
          void vkCmdSetCullMode(VkCommandBuffer cb, VkCullModeFlags cullMode) {
              static PFN_vkCmdSetCullMode real = NULL;
              if (!real) real = (PFN_vkCmdSetCullMode)dlsym(RTLD_DEFAULT, "vkCmdSetCullMode");
              if (real) real(cb, cullMode);
          }
          void vkCmdSetFrontFace(VkCommandBuffer cb, VkFrontFace frontFace) {
              static PFN_vkCmdSetFrontFace real = NULL;
              if (!real) real = (PFN_vkCmdSetFrontFace)dlsym(RTLD_DEFAULT, "vkCmdSetFrontFace");
              if (real) real(cb, frontFace);
          }
          void vkCmdSetPrimitiveTopology(VkCommandBuffer cb, VkPrimitiveTopology topology) {
              static PFN_vkCmdSetPrimitiveTopology real = NULL;
              if (!real) real = (PFN_vkCmdSetPrimitiveTopology)dlsym(RTLD_DEFAULT, "vkCmdSetPrimitiveTopology");
              if (real) real(cb, topology);
          }
          void vkCmdSetDepthTestEnable(VkCommandBuffer cb, VkBool32 depthTestEnable) {
              static PFN_vkCmdSetDepthTestEnable real = NULL;
              if (!real) real = (PFN_vkCmdSetDepthTestEnable)dlsym(RTLD_DEFAULT, "vkCmdSetDepthTestEnable");
              if (real) real(cb, depthTestEnable);
          }
          void vkCmdSetDepthWriteEnable(VkCommandBuffer cb, VkBool32 depthWriteEnable) {
              static PFN_vkCmdSetDepthWriteEnable real = NULL;
              if (!real) real = (PFN_vkCmdSetDepthWriteEnable)dlsym(RTLD_DEFAULT, "vkCmdSetDepthWriteEnable");
              if (real) real(cb, depthWriteEnable);
          }
          void vkCmdSetDepthCompareOp(VkCommandBuffer cb, VkCompareOp depthCompareOp) {
              static PFN_vkCmdSetDepthCompareOp real = NULL;
              if (!real) real = (PFN_vkCmdSetDepthCompareOp)dlsym(RTLD_DEFAULT, "vkCmdSetDepthCompareOp");
              if (real) real(cb, depthCompareOp);
          }
          void vkCmdSetStencilTestEnable(VkCommandBuffer cb, VkBool32 stencilTestEnable) {
              static PFN_vkCmdSetStencilTestEnable real = NULL;
              if (!real) real = (PFN_vkCmdSetStencilTestEnable)dlsym(RTLD_DEFAULT, "vkCmdSetStencilTestEnable");
              if (real) real(cb, stencilTestEnable);
          }
          void vkCmdSetStencilOp(VkCommandBuffer cb, VkStencilFaceFlags faceMask, VkStencilOp failOp, VkStencilOp passOp, VkStencilOp depthFailOp, VkCompareOp compareOp) {
              static PFN_vkCmdSetStencilOp real = NULL;
              if (!real) real = (PFN_vkCmdSetStencilOp)dlsym(RTLD_DEFAULT, "vkCmdSetStencilOp");
              if (real) real(cb, faceMask, failOp, passOp, depthFailOp, compareOp);
          }
          void vkCmdSetDepthBiasEnable(VkCommandBuffer cb, VkBool32 depthBiasEnable) {
              static PFN_vkCmdSetDepthBiasEnable real = NULL;
              if (!real) real = (PFN_vkCmdSetDepthBiasEnable)dlsym(RTLD_DEFAULT, "vkCmdSetDepthBiasEnable");
              if (real) real(cb, depthBiasEnable);
          }
          void vkCmdSetPrimitiveRestartEnable(VkCommandBuffer cb, VkBool32 primitiveRestartEnable) {
              static PFN_vkCmdSetPrimitiveRestartEnable real = NULL;
              if (!real) real = (PFN_vkCmdSetPrimitiveRestartEnable)dlsym(RTLD_DEFAULT, "vkCmdSetPrimitiveRestartEnable");
              if (real) real(cb, primitiveRestartEnable);
          }
          void vkCmdSetRasterizerDiscardEnable(VkCommandBuffer cb, VkBool32 rasterizerDiscardEnable) {
              static PFN_vkCmdSetRasterizerDiscardEnable real = NULL;
              if (!real) real = (PFN_vkCmdSetRasterizerDiscardEnable)dlsym(RTLD_DEFAULT, "vkCmdSetRasterizerDiscardEnable");
              if (real) real(cb, rasterizerDiscardEnable);
          }
          EOF
          
          # 9. Provide a valid dummy 1x1 PNG icon
          mkdir -p android/build/manosaba
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > android/build/manosaba/icon.png
          
          # 10. Provide a dummy empty Vulkan shader bundle
          mkdir -p "$DM_ROOT/build/android"
          touch "$DM_ROOT/build/android/manosaba.dmvk"

      - name: Build data-less APK
        run: |
          set -euo pipefail
          PRODUCT_PATH="$DM_ROOT/${{ steps.ws.outputs.product }}"
          SHADERS_PATH="$DM_ROOT/build/android/manosaba.dmvk"
          
          make -C android \
            GAME="$DM_GAME" \
            CC="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" \
            NDK="$ANDROID_HOME/ndk/$NDK_VERSION" \
            ANDROID_SDK="$ANDROID_HOME" \
            JAVA_HOME="$JAVA_HOME" \
            D8="$ANDROID_HOME/build-tools/35.0.1/d8" \
            ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar" \
            PRODUCT="$PRODUCT_PATH" \
            SHADERS="$SHADERS_PATH" \
            apk
        env:
          DM_ROOT: ${{ env.DM_ROOT }}
          DM_GAME: ${{ env.DM_GAME }}
          API: ${{ env.API }}
          NDK_VERSION: ${{ env.NDK_VERSION }}

      - name: Locate APK
        id: find-apk
        run: |
          set -euo pipefail
          APK=$(find android/build -type f -name '*.apk' ! -name '*-data.apk' | head -n1)
          [ -n "$APK" ] || { echo "APK not found" >&2; exit 1; }
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: manosaba-apk
          path: ${{ steps.find-apk.outputs.apk }}
          if-no-files-found: error
